# Builds the demo-only static site and publishes it to GitHub Pages.
# The full app (accounts, campaigns) needs the Node server; see README.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the static demo
        run: npm run build
        env:
          VITE_STATIC: '1'
          BASE_PATH: /${{ github.event.repository.name }}/
      # Pages has no server to send deep links like /demo/warhammer-40k back to
      # the app; it serves 404.html instead, so make that the app too.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
