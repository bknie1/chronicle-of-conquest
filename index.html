<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chronicle of Conquest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <button class="sigil" id="btn-home" title="Back to the start" aria-label="Back to the start">⚜</button>
      <div>
        <h1>Chronicle of Conquest</h1>
        <select id="campaign-select" class="campaign-select" aria-label="Campaign"></select>
      </div>
    </div>
    <label class="settings">
      <span class="visually-hidden">Setting</span>
      <select id="setting-select"></select>
    </label>
    <div class="actions">
      <button id="btn-challenge">⚔ Issue challenge</button>
      <button id="btn-report" class="primary">Report a result</button>
      <button id="btn-about" class="ghost" title="What is this?">What is this?</button>
      <button id="btn-account" class="ghost">Sign in</button>
    </div>
  </header>

  <main class="layout">
    <section class="about-page" id="about-page" hidden></section>
    <section class="viewport" id="viewport">
      <div class="world">
        <img alt="Map of the Old World" draggable="false">
        <svg class="territory" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="overlay"></div>
      </div>
      <nav class="realm-bar" id="realm-bar" aria-label="Realms" hidden></nav>
      <div class="realms-overview" id="realms-overview" hidden></div>
      <div class="tooltip" id="tooltip" hidden></div>
      <div class="peek" id="peek" hidden></div>
      <div class="map-controls">
        <button id="zoom-in" title="Zoom in">+</button>
        <button id="zoom-out" title="Zoom out">−</button>
        <button id="zoom-fit" title="Show whole map">⤢</button>
        <button id="labels-toggle" title="Show or hide place names" aria-pressed="true">Aa</button>
        <button id="sound-toggle" title="Sound is off. Turn it on." aria-pressed="false">♪</button>
        <button id="find-toggle" title="Find a place by name">⌕</button>
        <button id="add-place" title="Add a place of your own" hidden>✚</button>
      </div>
      <button class="back-btn" id="back-btn" hidden>← Back to the map</button>
      <div class="finder" id="finder" hidden>
        <input id="find-input" type="search" placeholder="Find a place…" autocomplete="off" aria-label="Find a place by name">
        <ul id="find-results" class="find-results"></ul>
      </div>
      <div class="toast" id="toast"></div>
      <div class="map-loading" aria-hidden="true"><span class="sigil">⚜</span></div>
    </section>
    <div class="sheet" id="sheet">
      <button class="sheet-handle" id="sheet-handle" aria-label="Show campaign details">
        <span class="grip"></span><b id="sheet-title">Campaign</b><span class="chev">▲</span>
      </button>
      <aside class="panel" id="panel"></aside>
    </div>
  </main>

  <footer class="timeline">
    <button id="play" title="Replay the campaign">▶</button>
    <input type="range" id="scrub" min="0" step="1" aria-label="Campaign date">
    <div class="date" id="date-label"></div>
  </footer>

  <dialog id="modal"></dialog>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
